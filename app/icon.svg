<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Three stacked bays, filling from the bottom: what the product is about,
       at 16px, without a literal warehouse drawing that would turn to mud. -->
  <rect width="32" height="32" rx="7" fill="#1f2937"/>
  <rect x="8" y="19" width="16" height="5" rx="1.5" fill="#f9fafb"/>
  <rect x="8" y="12" width="16" height="5" rx="1.5" fill="#f9fafb" opacity=".62"/>
  <rect x="8" y="5" width="16" height="5" rx="1.5" fill="#f9fafb" opacity=".3"/>
</svg>
